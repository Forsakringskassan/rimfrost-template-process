name: Bundle Maven CI

on: [workflow_dispatch, workflow_call, push, pull_request]

jobs:
  call-workflow:
    uses: Forsakringskassan/.github/.github/workflows/bundle-maven-ci.yaml@cbd74f159d942a8e96a9acd1dd251601839a7530 # main
    secrets:
      PACKAGES_RW_ACTOR: ${{ secrets.PACKAGES_RW_ACTOR }}
      PACKAGES_RW_TOKEN: ${{ secrets.PACKAGES_RW_TOKEN }}

  # TODO Remove this job if the process has no processvy
  # TODO Pin uses to a released rimfrost-framework-process SHA (# <tag>) when FKPOC-1307 is released, and use the same release in framework-ref
  validate-processbeskrivning:
    uses: Forsakringskassan/rimfrost-framework-process/.github/workflows/validate-processbeskrivning.yaml@feat/FKPOC-1307-processbeskrivning-schema
    with:
      framework-ref: feat/FKPOC-1307-processbeskrivning-schema
